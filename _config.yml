title: "Yufei Gu's Personal Website"
author: "Yufei Gu"
email: "yufei.gu.451@outlook.com"
description: "PhD student in learning theory and optimization building efficient optimizers and generalization tools for deep learning and LLMs."
url: "https://yufei-gu-451.github.io"
baseurl: ""
header_pages:
  - index.md
  - publications.md
  - blogs.md
  - cv.md

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - _reading_lists/_TEMPLATE.md

# Include files
include:
  - _pages

# Collections
collections:
  reading_lists:
    output: true
    permalink: /reading-lists/:path/

defaults:
  - scope:
      path: ""
      type: reading_lists
    values:
      layout: reading-list